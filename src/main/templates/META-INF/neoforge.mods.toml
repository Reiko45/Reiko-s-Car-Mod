# Mod metadata. The placeholder values are filled in from gradle.properties at build time.
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/Reiko45/Reiko-s-Car-Mod/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
displayURL="https://github.com/Reiko45/Reiko-s-Car-Mod"
logoFile="logo.png"
logoBlur=false
description='''
Over thirty drivable cars, trucks, motorcycles and a city bus, with trailers and campers to tow, built at a Car Workbench and run on BuildCraft Reborn's fuel (or its MJ, for the electric ones). Everything you buy is paid for in Reiko's Economy Mod money, by card or cash.

Sell gasoline, diesel and charge from your own pumps and charging stations. Cars wear out, get dirty and show their crashes: fix them at a Repair Bench, wash them, tune them and race them. Lay roads with a road paver, put up traffic lights, cameras, parking meters, toll gates and garage doors, and run dealerships, rentals, impound lots, insurance, a DMV, bus routes, mail and the car jobs.

Every car has keys, a license plate, turn signals, headlights, a radio and a GPS, and the Car Manual (with Patchouli) explains it all in game. 26 advancements to earn along the way.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="reikoeconomy"
    type="required"
    versionRange="${economy_version_range}"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="buildcraftreborn"
    type="required"
    versionRange="${buildcraft_version_range}"
    ordering="AFTER"
    side="BOTH"

# Optional: with Xaero's Minimap, the GPS shows its destination and your cars on the minimap and lists your waypoints.
[[dependencies.${mod_id}]]
    modId="jei"
    type="optional"
    versionRange="[19,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="xaerominimap"
    type="optional"
    versionRange="[24,)"
    ordering="NONE"
    side="CLIENT"

# Optional: with Patchouli, the Car Manual (the mod's guide book) is given to every player on their first join, can be
# crafted, and opens from the Car Workbench.
[[dependencies.${mod_id}]]
    modId="patchouli"
    type="optional"
    versionRange="[1.21-80,)"
    ordering="NONE"
    side="BOTH"
