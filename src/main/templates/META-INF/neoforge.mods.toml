# Mod metadata. The placeholder values are filled in from gradle.properties at build time.
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
logoFile="logo.png"
logoBlur=false
description='''
Drivable cars that run on BuildCraft Reborn's fuel, and gas pumps that sell it for cash or card through Reiko's Economy Mod.
Pipe fuel from your refinery into a pump, set a price, and other players pay you to fill up.
Cars wear out as they're driven; fix them at a Repair Bench, with your own parts or at a mechanic's prices.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="reikoeconomy"
    type="required"
    versionRange="${economy_version_range}"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="buildcraftreborn"
    type="required"
    versionRange="${buildcraft_version_range}"
    ordering="AFTER"
    side="BOTH"

# Optional: with Xaero's Minimap, the GPS shows its destination and your cars on the minimap and lists your waypoints.
[[dependencies.${mod_id}]]
    modId="xaerominimap"
    type="optional"
    versionRange="[24,)"
    ordering="NONE"
    side="CLIENT"

# Optional: with Patchouli, the Car Manual (the mod's guide book) is given to every player on their first join, can be
# crafted, and opens from the Car Workbench.
[[dependencies.${mod_id}]]
    modId="patchouli"
    type="optional"
    versionRange="[1.21-80,)"
    ordering="NONE"
    side="BOTH"
