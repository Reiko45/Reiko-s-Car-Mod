# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.265
# The oldest NeoForge the mod runs on (BuildCraft Reborn 2.1.0 needs 21.1.264 too).
neo_version_range=[21.1.265,)
loader_version_range=[1,)

## Mod Properties
mod_id=reikocars
mod_name=Reiko's Car Mod
mod_license=GPL-3.0
mod_version=1.18.0
mod_authors=Reiko45
mod_group_id=com.reiko.cars

## The two mods this one is built on. Their jars live in libs/ (see README.md).
economy_jar=reikoeconomy-1.1.0.jar
buildcraft_jar=buildcraftreborn-2.1.0.jar
economy_version_range=[1.1.0,)
buildcraft_version_range=[2.1.0,)

## JEI (optional). The plugin is compiled against this version's API and works with it and newer 1.21.1 versions.
jei_version=19.21.2.313
