plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    exclude("**/*.bbmodel") // Blockbench project files live in blockbench/, but keep any stray ones out of the jar
}

sourceSets {
    // Compile-time stand-ins for the few classes of Xaero's Minimap that the GPS uses (gps/XaeroCompat). Xaero's mod is
    // optional and isn't ours to redistribute, so these are compiled against instead; they never go in the jar or on the
    // dev runs' classpath, where the real mod is used if it's there.
    xaeroStubs
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // ./gradlew runClient -Pshowcase builds a test scene, drives a car and saves screenshots (see DevShowcase);
            // -Pshowcase=workbench does the same for the Car Workbench.
            def showcase = project.findProperty('showcase')
            systemProperty 'reikocars.showcase', showcase == null ? 'false' : (showcase.toString() ?: 'true')
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Starts a server, runs every game test in the mod, then exits.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

neoForge.addModdingDependenciesTo(sourceSets.xaeroStubs)

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    // JEI. Only its API is compiled against; the full mod is on the dev runs' classpath to try the plugin out.
    maven {
        name = "Jared's Maven"
        url = "https://maven.blamejared.com/"
        content {
            includeGroup "mezz.jei"
            includeGroup "vazkii.patchouli"
        }
    }
}

dependencies {
    // Reiko's Economy Mod (cash, cards, ShopPayments) and BuildCraft Reborn (the fuels and their energy values).
    // Both are required at runtime too, so they go on the dev runs' classpath, where NeoForge loads them as mods.
    implementation files("libs/${economy_jar}")
    implementation files("libs/${buildcraft_jar}")

    // JEI is optional: the plugin in compat/jei only loads when JEI is installed.
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    // -PnoOptionalMods leaves JEI and Patchouli out of the dev runs, to try the mod without them.
    def optionalMods = !project.hasProperty('noOptionalMods')
    if (optionalMods) {
        localRuntime("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}") {
            transitive = false // the mod jar has everything it needs inside it
        }
    }

    // Patchouli is optional too: it shows the Car Manual (assets/reikocars/patchouli_books/car_manual). Only its API is
    // compiled against, in compat/patchouli; the full mod is on the dev runs' classpath, to read the book there.
    compileOnly "vazkii.patchouli:Patchouli:${patchouli_version}:api"
    if (optionalMods) {
        localRuntime("vazkii.patchouli:Patchouli:${patchouli_version}") {
            transitive = false
        }
    }

    // Xaero's Minimap is optional too: the GPS shows its destination and your cars on it, and lists its waypoints.
    // It's compiled against stand-ins (see sourceSets.xaeroStubs); to try it in a dev run, pass the folder its jar
    // (and World Map's, if you like) is in: ./gradlew runClient -PxaeroJars=/path/to/folder
    compileOnly sourceSets.xaeroStubs.output
    def xaeroJars = project.findProperty('xaeroJars')
    if (xaeroJars != null) {
        localRuntime fileTree(xaeroJars.toString()) { include '*.jar' }
    }

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version       : minecraft_version,
            minecraft_version_range : minecraft_version_range,
            neo_version             : neo_version,
            neo_version_range       : neo_version_range,
            loader_version_range    : loader_version_range,
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : mod_license,
            mod_version             : mod_version,
            mod_authors             : mod_authors,
            economy_version_range   : economy_version_range,
            buildcraft_version_range: buildcraft_version_range,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// The dev showcase only runs from the workspace; keep it out of the mod jar.
tasks.named('jar', Jar) {
    exclude 'com/reiko/cars/dev/**'
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
